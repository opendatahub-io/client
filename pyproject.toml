[project]
name = "tritonclient"
dynamic = ["version"]
description = "Python client library and utilities for communicating with Triton Inference Server"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.6"
dependencies = [
    "numpy>=1.19.1",
    "python-rapidjson>=0.9.1",
    "urllib3>=2.0.7",
]

[project.optional-dependencies]
grpc = [
    "grpcio>=1.63.0,<1.68",
    "packaging>=14.1",
    "protobuf>=6.30.0,<7.0",
]
http = [
    "aiohttp>=3.8.1,<4.0.0",
    "geventhttpclient>=2.3.3",
]
cuda = [
    "cuda-python",
]
all = [
    "grpcio>=1.63.0,<1.68",
    "packaging>=14.1",
    "protobuf>=6.30.0,<7.0",
    "aiohttp>=3.8.1,<4.0.0",
    "geventhttpclient>=2.3.3",
    "cuda-python",
]

[build-system]
requires = ["setuptools>=61.0", "setuptools_scm>=8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.setuptools]
package-dir = {"" = "src/python/library"}
zip-safe = false

[tool.setuptools.packages.find]
where = ["src/python/library"]
exclude = ["tests", "requirements"]

[tool.setuptools.package-data]
"*" = ["*.so"]

[tool.codespell]
# note: pre-commit passes explicit lists of files here, which this skip file list doesn't override -
# this is only to allow you to run codespell interactively
# this also overrides the grpc_generated folder, since it is generated
skip = "./.git,./.github,./src/grpc_generated"
# ignore short words, and typename parameters like OffsetT
ignore-regex = "\\b(.{1,4}|[A-Z]\\w*T)\\b"
# ignore allowed words
# ignoring atleast to avoid testing::AtLeast from getting flagged
ignore-words-list = "atleast"
# use the 'clear' dictionary for unambiguous spelling mistakes
builtin = "clear"
# disable warnings about binary files and wrong encoding
quiet-level = 3

[tool.isort]
profile = "black"
use_parentheses = true
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
ensure_newline_before_comments = true
line_length = 88
balanced_wrapping = true
indent = "    "
skip = ["build"]

